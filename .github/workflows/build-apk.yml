name: Build Secure Neank APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 4. Auto-Verify Files & Build APK
        run: |
          KT_FOUND=$(find . -iname "*MainActivity*.kt" | head -n 1)
          XML_FOUND=$(find . -iname "*activity_main*.xml" | head -n 1)
          if [ -n "$KT_FOUND" ]; then cp "$KT_FOUND" /tmp/MainActivity.kt; fi
          if [ -n "$XML_FOUND" ]; then cp "$XML_FOUND" /tmp/activity_main.xml; fi

          rm -rf app
          mkdir -p app/src/main/java/com/neank/remote
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          if [ -f /tmp/MainActivity.kt ]; then
            cp /tmp/MainActivity.kt app/src/main/java/com/neank/remote/MainActivity.kt
          else
            echo "MainActivity.kt file nahi mili! Kripaya MainActivity.kt check karein."
            exit 1
          fi

          if [ -f /tmp/activity_main.xml ]; then
            cp /tmp/activity_main.xml app/src/main/res/layout/activity_main.xml
          else
            echo "activity_main.xml file nahi mili! Kripaya activity_main.xml check karein."
            exit 1
          fi

          echo "android.useAndroidX=true" > gradle.properties

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Neank"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.3.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.neank.remote"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.neank.remote"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0-SecurePro"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")

              val cameraxVersion = "1.3.2"
              implementation("androidx.camera:camera-core:$cameraxVersion")
              implementation("androidx.camera:camera-camera2:$cameraxVersion")
              implementation("androidx.camera:camera-lifecycle:$cameraxVersion")
              implementation("androidx.camera:camera-video:$cameraxVersion")
              implementation("androidx.camera:camera-view:$cameraxVersion")

              implementation("io.getstream:stream-webrtc-android:1.1.1")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.hardware.camera.any" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <application
                  android:label="Neank"
                  android:allowBackup="false"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:keepScreenOn="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".NeankTouchService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/neank_accessibility_config" />
                  </service>

                  <service
                      android:name=".NeankScreenCaptureService"
                      android:foregroundServiceType="mediaProjection"
                      android:exported="false" />

                  <receiver
                      android:name=".NeankSecretDialerReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.provider.Telephony.SECRET_CODE" />
                          <data android:scheme="android_secret_code" android:host="1080" />
                      </intent-filter>
                  </receiver>

              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/neank_accessibility_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/app_name"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:notificationTimeout="50" />
          EOF

          echo '<resources><string name="app_name">Neank</string></resources>' > app/src/main/res/values/strings.xml

          KT_FILE="app/src/main/java/com/neank/remote/MainActivity.kt"
          sed -i 's/ private set/\n    private set/g' "$KT_FILE"
          sed -i 's/mandatory\.add(MediaConstraints/add(MediaConstraints/g' "$KT_FILE"
          sed -i 's/add(MediaConstraints/mandatory.add(MediaConstraints/g' "$KT_FILE"
          sed -i 's/codec.getInputBuffer(inIdx)?.clear()?.put(mixedBuf, 0, read)/val ib = codec.getInputBuffer(inIdx); ib?.clear(); ib?.put(mixedBuf, 0, read)/g' "$KT_FILE"

          gradle assembleDebug --no-daemon

      - name: 5. Upload Secure APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neank-Secure-Release-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
