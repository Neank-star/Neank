name: Build Secure Neank APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 4. Generate All Complete Files & Build APK
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/neank/remote
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          echo "android.useAndroidX=true" > gradle.properties

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Neank"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.3.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.neank.remote"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.neank.remote"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0-SecurePro"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")

              val cameraxVersion = "1.3.2"
              implementation("androidx.camera:camera-core:$cameraxVersion")
              implementation("androidx.camera:camera-camera2:$cameraxVersion")
              implementation("androidx.camera:camera-lifecycle:$cameraxVersion")
              implementation("androidx.camera:camera-video:$cameraxVersion")
              implementation("androidx.camera:camera-view:$cameraxVersion")

              implementation("io.getstream:stream-webrtc-android:1.1.1")
          }
          EOF

          echo '<resources><string name="app_name">Neank</string></resources>' > app/src/main/res/values/strings.xml

          cat << 'EOF' > app/src/main/res/xml/neank_accessibility_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/app_name"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:notificationTimeout="50" />
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.hardware.camera.any" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <application
                  android:label="Neank"
                  android:allowBackup="false"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:keepScreenOn="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".NeankTouchService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/neank_accessibility_config" />
                  </service>

                  <service
                      android:name=".NeankScreenCaptureService"
                      android:foregroundServiceType="mediaProjection"
                      android:exported="false" />

                  <receiver
                      android:name=".NeankSecretDialerReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.provider.Telephony.SECRET_CODE" />
                          <data android:scheme="android_secret_code" android:host="1080" />
                      </intent-filter>
                  </receiver>

              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#090D16">

              <org.webrtc.SurfaceViewRenderer
                  android:id="@+id/remoteVideoView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

              <View
                  android:id="@+id/reelsSafeZoneGuide"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_marginTop="48dp"
                  android:layout_marginBottom="130dp"
                  android:layout_marginEnd="64dp"
                  android:layout_marginStart="16dp"
                  android:background="@android:drawable/editbox_dropdown_light_frame"
                  android:alpha="0.18"
                  android:visibility="gone" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_gravity="top"
                  android:layout_marginTop="56dp"
                  android:gravity="center"
                  android:orientation="horizontal">

                  <Spinner
                      android:id="@+id/spinnerNodeList"
                      android:layout_width="130dp"
                      android:layout_height="36dp"
                      android:background="#1E293B"
                      android:visibility="gone" />

                  <TextView
                      android:id="@+id/txtActiveMicBadge"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="8dp"
                      android:background="#CC064E3B"
                      android:paddingHorizontal="10dp"
                      android:paddingVertical="4dp"
                      android:text="Mic: Active"
                      android:textColor="#6EE7B7"
                      android:textSize="11sp"
                      android:visibility="gone" />
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/teleprompterContainer"
                  android:layout_width="match_parent"
                  android:layout_height="220dp"
                  android:layout_gravity="top"
                  android:layout_marginTop="96dp"
                  android:layout_marginHorizontal="16dp"
                  android:background="#880F172A"
                  android:orientation="vertical"
                  android:padding="10dp"
                  android:visibility="gone">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="TELEPROMPTER"
                          android:textColor="#38BDF8"
                          android:textSize="11sp"
                          android:textStyle="bold" />
                      <SeekBar
                          android:id="@+id/seekPrompterSpeed"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1" />
                      <Button
                          android:id="@+id/btnResetPrompter"
                          android:layout_width="wrap_content"
                          android:layout_height="30dp"
                          android:text="Reset"
                          android:textSize="10sp" />
                  </LinearLayout>

                  <ScrollView
                      android:id="@+id/prompterScrollView"
                      android:layout_width="match_parent"
                      android:layout_height="0dp"
                      android:layout_weight="1"
                      android:layout_marginTop="4dp">
                      <TextView
                          android:id="@+id/txtPrompterScript"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:textColor="#FFFFFF"
                          android:textSize="18sp"
                          android:textStyle="bold" />
                  </ScrollView>
                  <EditText
                      android:id="@+id/inputPrompterScript"
                      android:layout_width="match_parent"
                      android:layout_height="34dp"
                      android:hint="Script paste karein..."
                      android:textColor="#FFFFFF"
                      android:textColorHint="#94A3B8"
                      android:textSize="11sp" />
              </LinearLayout>

              <ScrollView
                  android:id="@+id/masterSwitchDrawer"
                  android:layout_width="280dp"
                  android:layout_height="wrap_content"
                  android:layout_gravity="top|end"
                  android:layout_marginTop="52dp"
                  android:layout_marginEnd="8dp"
                  android:background="#F20F172A"
                  android:padding="12dp"
                  android:visibility="gone">
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical">
                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="MASTER SWITCHES"
                          android:textColor="#38BDF8"
                          android:textSize="11sp"
                          android:textStyle="bold" />
                      <Switch android:id="@+id/swLiveAudioListen" android:layout_width="match_parent" android:layout_height="36dp" android:checked="true" android:text="Hear Live Audio" android:textColor="#FFFFFF" android:textSize="11sp" />
                      <Switch android:id="@+id/swOldPhoneMic" android:layout_width="match_parent" android:layout_height="36dp" android:checked="true" android:text="Record Rig Mic" android:textColor="#FFFFFF" android:textSize="11sp" />
                      <Switch android:id="@+id/swNewPhoneVoiceover" android:layout_width="match_parent" android:layout_height="36dp" android:checked="false" android:text="Director Voiceover" android:textColor="#FFFFFF" android:textSize="11sp" />
                      <Switch android:id="@+id/swAutoDucking" android:layout_width="match_parent" android:layout_height="36dp" android:checked="true" android:text="Auto-Ducking" android:textColor="#FFFFFF" android:textSize="11sp" />
                      <Switch android:id="@+id/swTeleprompter" android:layout_width="match_parent" android:layout_height="36dp" android:checked="false" android:text="Teleprompter" android:textColor="#FFFFFF" android:textSize="11sp" />
                      <Switch android:id="@+id/swReelsSafeZone" android:layout_width="match_parent" android:layout_height="36dp" android:checked="true" android:text="Reels Safe-Zone" android:textColor="#FFFFFF" android:textSize="11sp" />
                      <Switch android:id="@+id/swAnyDeskTouch" android:layout_width="match_parent" android:layout_height="36dp" android:checked="true" android:text="Remote Touch" android:textColor="#FFFFFF" android:textSize="11sp" />
                      <Switch android:id="@+id/swStealthDarkScreen" android:layout_width="match_parent" android:layout_height="36dp" android:checked="false" android:text="Screen Dim (Battery)" android:textColor="#FFFFFF" android:textSize="11sp" />
                      <Switch android:id="@+id/swStealthHideApp" android:layout_width="match_parent" android:layout_height="36dp" android:checked="false" android:text="Hide App Icon" android:textColor="#F43F5E" android:textSize="11sp" />
                  </LinearLayout>
              </ScrollView>

              <LinearLayout
                  android:id="@+id/setupPanel"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_gravity="center"
                  android:layout_margin="24dp"
                  android:orientation="vertical"
                  android:padding="20dp"
                  android:background="#E6111827">
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="NEANK SECURE STUDIO"
                      android:textColor="#38BDF8"
                      android:textSize="20sp"
                      android:textStyle="bold" />
                  <TextView
                      android:id="@+id/txtStatus"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="6dp"
                      android:text="Role chunein: Rig node ya Director Hub"
                      android:textColor="#E2E8F0"
                      android:textSize="13sp" />
                  <Button
                      android:id="@+id/btnStartOldPhoneHost"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="14dp"
                      android:backgroundTint="#10B981"
                      android:text="1. Purana Phone (Start Rig Node)"
                      android:textColor="#FFFFFF" />
                  <EditText
                      android:id="@+id/inputHostIp"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="14dp"
                      android:hint="Rig IP dalein (e.g. 192.168.43.1)"
                      android:textColor="#FFFFFF"
                      android:textColorHint="#94A3B8"
                      android:inputType="phone" />
                  <Button
                      android:id="@+id/btnConnectNewPhone"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:backgroundTint="#3B82F6"
                      android:text="2. Naya Phone (Connect Director Hub)"
                      android:textColor="#FFFFFF" />
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/topControllerBar"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_gravity="top"
                  android:background="#B3000000"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:padding="6dp"
                  android:visibility="gone">
                  <Button android:id="@+id/btnModeStudio" android:layout_width="0dp" android:layout_height="36dp" android:layout_weight="1" android:backgroundTint="#EC4899" android:text="9:16 Studio" android:textSize="11sp" />
                  <Button android:id="@+id/btnModeAnyDesk" android:layout_width="0dp" android:layout_height="36dp" android:layout_weight="1" android:layout_marginStart="4dp" android:backgroundTint="#334155" android:text="AnyDesk" android:textSize="11sp" />
                  <Button android:id="@+id/btnPullReelFile" android:layout_width="wrap_content" android:layout_height="36dp" android:layout_marginStart="4dp" android:backgroundTint="#059669" android:text="Pull MP4" android:textSize="11sp" />
                  <Button android:id="@+id/btnToggleSwitchDrawer" android:layout_width="wrap_content" android:layout_height="36dp" android:layout_marginStart="4dp" android:backgroundTint="#475569" android:text="Switches" android:textSize="11sp" />
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/bottomStudioBar"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_gravity="bottom"
                  android:background="#B3000000"
