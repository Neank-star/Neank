name: Build Secure Neank APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Setup Gradle 8.7 & Build Release APK
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          arguments: assembleRelease -Pandroid.useAndroidX=true

      - name: 5. Upload Secure APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neank-Secure-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          
